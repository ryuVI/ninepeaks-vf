<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lecteur Nine Peaks VF en scroll vertical.">
  <title>Lecteur - Nine Peaks VF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reader">
  <header id="reader-header" class="site-header reader-header" aria-label="Navigation du lecteur">
    <div class="container reader-topbar">
      <a class="btn ghost" href="index.html" aria-label="Retour a la liste des chapitres">Retour</a>
      <div class="reader-title-wrap">
        <h1 id="reader-title">Chargement du chapitre...</h1>
        <p id="page-counter">Page 0 / 0</p>
      </div>
      <div class="chapter-nav-inline">
        <button id="prev-chapter" class="btn ghost" type="button">Chapitre precedent</button>
        <button id="next-chapter" class="btn ghost" type="button">Chapitre suivant</button>
      </div>
    </div>
    <div class="container reader-controls">
      <div class="mode-switch" role="group" aria-label="Mode de lecture">
        <span class="zoom-pill">Mode: Defilement</span>
      </div>
      <div class="zoom-controls" role="group" aria-label="Zoom">
        <button id="zoom-out" class="btn ghost" type="button">-</button>
        <span id="zoom-level" class="zoom-pill">100%</span>
        <button id="zoom-reset" class="btn ghost" type="button">Reset</button>
        <button id="zoom-in" class="btn ghost" type="button">+</button>
      </div>
      <div class="reader-account">
        <span id="reader-user" class="muted"></span>
      </div>
    </div>
  </header>

  <main class="reader-main" aria-live="polite">
    <section id="reader-state" class="container state-msg">Chargement du lecteur...</section>
    <section id="reader-pages" class="reader-pages" aria-label="Pages du chapitre"></section>

    <section class="reader-comments card" aria-labelledby="comments-title">
      <div class="comments-head">
        <h2 id="comments-title">Commentaires</h2>
        <span id="comments-count" class="muted">0 commentaire</span>
      </div>
      <form id="comment-form" class="comment-form" novalidate>
        <textarea id="comment-input" class="input-textarea" placeholder="Ecris ton commentaire..." maxlength="800"></textarea>
        <div class="comment-actions">
          <button id="comment-submit" class="btn primary" type="submit">Publier</button>
          <span id="comment-user" class="muted">Connecte-toi pour commenter</span>
        </div>
      </form>
      <div id="comments-list" class="comments-list"></div>
      <p id="comments-empty" class="state-msg">Aucun commentaire pour ce chapitre.</p>
    </section>
  </main>

  <div class="floating-nav" aria-label="Navigation rapide">
    <button id="page-up" class="btn primary" type="button" aria-label="Page precedente">⬆</button>
    <button id="page-down" class="btn primary" type="button" aria-label="Page suivante">⬇</button>
  </div>

  <div class="reader-side-dock" aria-label="Actions rapides">
    <button id="bookmark-toggle" class="btn ghost icon-square" type="button" aria-label="Ajouter ou supprimer bookmark" title="Ajouter bookmark">🔖</button>
    <button id="ui-visibility-toggle" class="btn ghost icon-square" type="button" aria-label="Masquer ou afficher l interface" title="Masquer l interface">👁️</button>
  </div>

  <script src="js/auth.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
